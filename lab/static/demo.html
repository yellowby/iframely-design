.nav a:hover { border-color: var(--ink3); }
.frame { position: relative; height: 100vh; height: 100svh; container-type: inline-size; }
.frame.g-pd { height: auto; min-height: 100svh; display: flex; align-items: center; padding: 60px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
.frame.g-pd .demo { width: 100%; max-width: 1200px; margin: 0 auto; }
.frame.g-ill, .frame.g-wm, .frame.g-dt, .frame.g-dta, .frame.g-dts, .frame.g-dtx, .frame.g-cv, .frame.g-pg, .frame.g-pdw, .frame.g-sec, .frame.g-pal { height: auto; min-height: 100svh; padding: 60px max(16px, env(safe-area-inset-right, 0px)) 40px; background: #fff; }
.frame.g-sec, .frame.g-pal { padding: 0; }
.frame.g-cv, .frame.g-pg { background: #fafafa; }
.frame.g-ill .demo, .frame.g-wm .demo, .frame.g-dt .demo, .frame.g-dta .demo, .frame.g-dts .demo, .frame.g-dtx .demo, .frame.g-cv .demo, .frame.g-pg .demo, .frame.g-pdw .demo, .frame.g-sec .demo, .frame.g-pal .demo { max-width: 1200px; margin: 0 auto; }
/* scenes keep their desktop layout: at least 1200 px wide, scrolling sideways in a narrower window */
.frame.g-pd, .frame.g-pdp, .frame.g-pdw, .frame.g-sec, .frame.g-pal { overflow-x: auto; }
.frame.g-pd .demo, .frame.g-pdp .demo, .frame.g-pdw .demo, .frame.g-sec .demo, .frame.g-pal .demo { min-width: 1200px; }

<script>
(() => {
  const all = DEMOS.list(); let un = null;
  function show() {
    const name = (location.hash || '').slice(1) || all[0].name;
    const i = Math.max(0, all.findIndex(d => d.name === name)); const d = all[i];
    if (un) un();
    const f = document.getElementById('frame'); f.className = 'frame g-' + ((d.alias && DEMOS.get(d.alias).group) || d.group);
    un = DEMOS.mount(f, d.name);
    document.getElementById('name').textContent = d.title; document.title = d.title + ' · Iframely Motion Lab';
    document.getElementById('back').href = 'index.html#' + d.name;
    document.getElementById('prev').href = '#' + all[(i - 1 + all.length) % all.length].name;
    document.getElementById('next').href = '#' + all[(i + 1) % all.length].name;
  }
  addEventListener('hashchange', show); show();
})();
</script>
